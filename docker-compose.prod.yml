# Прод-стек для avto-otvetchik.com: Postgres + приложение + worker + Caddy (TLS).
# Запуск на VPS: docker compose -f docker-compose.prod.yml up -d
# Файл .env — из .env.example (секреты не коммитить).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: wbweb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: wbweb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wbweb -d wbweb"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://wbweb:${POSTGRES_PASSWORD}@db:5432/wbweb
      APP_ENV: production
      PUBLIC_BASE_URL: https://avto-otvetchik.com
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    command: >
      sh -c "alembic upgrade head && uvicorn wb_web.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://wbweb:${POSTGRES_PASSWORD}@db:5432/wbweb
      APP_ENV: production
      PUBLIC_BASE_URL: https://avto-otvetchik.com
    depends_on:
      db:
        condition: service_healthy
    command: python -m wb_web.worker --interval 30

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
