{% extends "base.html" %}
{% block title %}Настройки ИИ — {{ shop.name }}{% endblock %}
{% block content %}
<p class="muted"><a href="/app/shops">← Магазины</a></p>
<h1>Настройки ИИ · {{ shop.name }}</h1>
<p class="muted small">Модель и ключ подключены сервисом — вам ничего настраивать не нужно. Здесь можно задать голос магазина, стиль и лимиты.</p>

<div class="panel">
  <form method="post" action="/app/shops/{{ shop.id }}/ai">
    <label for="ai_instructions">Голос магазина / доп. правила <span class="muted">(необязательно)</span></label>
    <textarea id="ai_instructions" name="instructions" rows="3" maxlength="4000" placeholder="Бренд «ТестПром», обращаемся на «вы», никаких обещаний вне правил…">{{ shop.ai_instructions or '' }}</textarea>

    <div class="grid cols-2">
      <div>
        <label for="ai_style">Стиль</label>
        <select id="ai_style" name="style">
          {% for value, label in [("friendly","дружелюбный"),("formal","официальный"),("neutral","нейтральный"),("premium","премиальный"),("warm","тёплый"),("concise","лаконичный")] %}
          <option value="{{ value }}" {% if shop.ai_style == value %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="ai_response_length">Длина ответа</label>
        <select id="ai_response_length" name="response_length">
          {% for value, label in [("very_short","1 предложение"),("short","1–2"),("medium","2–3"),("detailed","3–4")] %}
          <option value="{{ value }}" {% if shop.ai_response_length == value %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="grid cols-2">
      <div>
        <label for="ai_max_characters">Макс. символов</label>
        <input type="number" id="ai_max_characters" name="max_characters" min="32" max="2000" value="{{ shop.ai_max_characters }}">
      </div>
      <div>
        <label for="ai_daily_limit">Дневной лимит генераций (0 = выкл)</label>
        <input type="number" id="ai_daily_limit" name="daily_limit" min="0" max="10000" value="{{ shop.ai_daily_limit }}">
      </div>
    </div>

    <div class="grid cols-2">
      <div>
        <label for="ai_temperature">Температура (пусто = дефолт модели)</label>
        <input type="number" id="ai_temperature" name="temperature" min="0" max="2" step="0.1" value="{{ shop.ai_temperature if shop.ai_temperature is not none else '' }}">
      </div>
      <div>
        <label>Эмодзи в ответах</label>
        <label class="row" style="margin:0"><input type="checkbox" name="use_emoji" value="true" {% if shop.ai_use_emoji %}checked{% endif %} style="width:auto"> разрешить максимум один</label>
      </div>
    </div>

    <div class="form-foot">
      <button class="btn primary" type="submit">Сохранить</button>
    </div>
  </form>
</div>
{% endblock %}
