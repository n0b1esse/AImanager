{% extends "base.html" %}
{% block title %}Код 2FA — Авто-ответчик{% endblock %}
{% block content %}
<div class="login-box">
  <div class="panel">
    <h1>Админка · 2FA</h1>
    <p class="muted">Введите код из приложения-аутентификатора. Сессия действует 8 часов.</p>
    <form method="post" action="/app/admin/2fa">
      <label for="code">Код (6 цифр)</label>
      <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" autofocus required>
      <div class="form-foot"><button class="btn primary" type="submit" style="width:100%">Войти</button></div>
    </form>
  </div>
</div>
{% endblock %}
