# ВРЕМЕННЫЙ workflow: найти VPS, куда пускает SSH_KEY_VPS (только чтение).
# Удалить сразу после получения доступа. Работает только вручную.
name: Bootstrap VPS access (temp)

on:
  workflow_dispatch:
    inputs:
      ips:
        description: 'IP через пробел (по умолчанию все известные)'
        required: false
        type: string
        default: '178.219.159.134 178.219.159.34 176.126.166.223 176.126.165.65'

concurrency:
  group: bootstrap-vps-access
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_USER: ${{ secrets.SSH_USER_VPS }}
      SSH_PORT: ${{ secrets.SSH_PORT_VPS }}
      SSH_KEY: ${{ secrets.SSH_KEY_VPS }}
      IPS: ${{ inputs.ips }}

    steps:
      - name: Discover reachable VPS
        run: |
          set -u
          [ -n "$SSH_KEY" ] || { echo "::error::SSH_KEY_VPS не задан"; exit 1; }
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps_key && chmod 600 ~/.ssh/vps_key
          for ip in $IPS; do
            echo "======== $ip ========"
            ssh -i ~/.ssh/vps_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=8 -p "$PORT" "$SSH_USER@$ip" \
              'echo CI_AUTH_OK; hostname; whoami; . /etc/os-release && echo $PRETTY_NAME; echo "--- authorized_keys ---"; cat /root/.ssh/authorized_keys 2>/dev/null || echo "<нет>"; echo "--- docker ---"; command -v docker || echo NO_DOCKER' 2>&1 \
              || echo "CI_AUTH_FAIL"
          done
