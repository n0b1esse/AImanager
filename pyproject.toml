[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-review-ai-web"
version = "0.1.0"
description = "WB Review AI — SaaS: AI-ответы на отзывы Wildberries (BYOK)"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
  "alembic>=1.13,<2",
  "aiosqlite>=0.20,<1",
  "aiosmtplib>=3.0,<5",
  "asyncpg>=0.29,<1",
  "cryptography>=43,<46",
  "email-validator>=2.0,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "pydantic-settings>=2.5,<3",
  "sentry-sdk>=2.0,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wb_web = ["niches/*.yaml", "templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
